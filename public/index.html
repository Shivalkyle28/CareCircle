<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CareCircle | Keeping Care Connected</title>

    <!-- Main CareCircle stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main class="app-container">

        <!-- ================================
             HEADER / LOGO
             ================================ -->

        <header class="app-header">

            <div class="logo">

                <div class="logo-icon">
                    ♡
                </div>

                <div class="logo-text">
                    CareCircle
                </div>

            </div>

            <p class="tagline">
                Keeping Care Connected
            </p>

        </header>


        <!-- ================================
             CREATE ACCOUNT
             ================================ -->

        <section class="account-section">

            <h1>Create Account</h1>


            <!-- CAREGIVER -->

            <button
                class="account-card"
                id="caregiverButton"
                type="button"
            >

                <div class="user-icon">
                    👤
                </div>

                <div class="account-info">

                    <h2>Caregiver</h2>

                    <p>
                        I want to support my family
                        in care activities.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- CARE RECIPIENT -->

            <button
                class="account-card"
                id="recipientButton"
                type="button"
            >

                <div class="user-icon">
                    👤
                </div>

                <div class="account-info">

                    <h2>Care Recipient</h2>

                    <p>
                        I want to view and manage my
                        health while connecting with
                        my family care circle.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- SIGN IN -->

            <div class="signin-section">

                <p>
                    Already Have An Account?
                </p>

                <button
                    class="signin-button"
                    id="signinButton"
                    type="button"
                >
                    Sign In
                </button>

            </div>

        </section>

    </main>


    <!-- Main CareCircle JavaScript -->
    <script src="app.js"></script>

</body>

</html>
